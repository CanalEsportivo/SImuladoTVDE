<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172b4d;--muted:#62748a;--accent:#1769aa;--ok:#16794b;--bad:#b42318;--line:#dbe4ee;--shadow:0 8px 24px rgba(16,42,67,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#102a43,#1769aa);color:#fff;padding:24px 18px 20px;position:sticky;top:0;z-index:10;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.header-inner{max-width:900px;margin:auto}.brand{font-size:22px;font-weight:800}.subtitle{opacity:.88;font-size:13px;margin-top:4px}
main{max-width:900px;margin:0 auto;padding:18px 14px 50px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px}.muted{color:var(--muted)}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--accent);color:#fff}
button.secondary{background:#e8eef5;color:var(--ink)}button.danger{background:#fff0ee;color:var(--bad);border:1px solid #ffd1cb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:15px}}
.mode{display:flex;flex-direction:column;gap:5px;text-align:left;min-height:88px}.mode small{font-weight:500;opacity:.85}
.progress{height:8px;background:#e6edf4;border-radius:99px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--accent);width:0}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.question{font-size:19px;line-height:1.5;font-weight:700;margin-bottom:18px}.image-note{padding:10px 12px;border-radius:10px;background:#fff8e6;border:1px solid #f4d58a;color:#73520b;font-size:13px;margin:10px 0 14px}
.option{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:9px 0;padding:14px;border-radius:12px;font-weight:600}
.option:hover{border-color:#9eb8d0}.option.selected{border:2px solid var(--accent);background:#eef7ff}.option.correct{border:2px solid var(--ok);background:#eaf8f0}.option.wrong{border:2px solid var(--bad);background:#fff0ee}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:15px}.nav button{flex:1}
.result{text-align:center}.score{font-size:48px;font-weight:900;margin:8px 0}.pass{color:var(--ok)}.fail{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8eef5;font-size:12px;font-weight:700}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;color:var(--ink)}
.hidden{display:none!important}.small{font-size:12px}.center{text-align:center}.sticky-actions{position:sticky;bottom:10px;z-index:5}
</style>

"C","text":"Evitar tocar diretamente na área queimada."}],"answer":"C","hasImageNotice":true},{"idx":314,"number":330,"group":"Grupo 13500 — Situações de emergência e primeiros","question":"Para sinalizar corretamente o local de um acidente, o\nmotorista deve:","alternatives":[{"letter":"A","text":"Ligar as luzes de perigo, vestir o colete refletor e colocar o triângulo de\npré- sinalização de perigo."},{"letter":"B","text":"Abandonar o local do acidente."}],"answer":"A","hasImageNotice":true},{"idx":315,"number":331,"group":"Grupo 13500 — Situações de emergência e primeiros","question":"Os princípios gerais do socorrismo são:","alternatives":[{"letter":"A","text":"Prever, ajudar e socorrer."},{"letter":"B","text":"Parar, socorrer e alertar."},{"letter":"C","text":"Prevenir, alertar e socorrer ."}],"answer":"C","hasImageNotice":false}];
const SIM_COUNT = 30;
const PASS_SCORE = 27;
const TIME_LIMIT = 60*60;
let state = {screen:"home", mode:null, list:[], pos:0, selected:null, answers:[], startedAt:null, timer:null, checked:false, finished:false};

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function mistakes(){try{return JSON.parse(localStorage.getItem("tvde_mistakes")||"[]")}catch{return[]}}
function saveMistake(idx){let m=mistakes();if(!m.includes(idx))m.push(idx);localStorage.setItem("tvde_mistakes",JSON.stringify(m))}
function clearMistakes(){localStorage.removeItem("tvde_mistakes")}
function groups(){return [...new Set(QUESTIONS.map(q=>q.group))]}
function renderHome(){
 state.screen="home"; clearInterval(state.timer);
 const m=mistakes();
 app.innerHTML=`<div class="card"><h1>Preparação para o exame TVDE</h1><p class="muted">Escolha como quer estudar. As questões são as 316 ocorrências do material utilizado para esta versão do app, mantendo a ordem e os grupos do material.</p></div>
 <div class="grid">
  <button class="mode" onclick="startSim()"><b>📝 SIMULADO</b><small>30 questões • 60 minutos • resultado no final</small></button>
  <button class="mode" onclick="startStudy(QUESTIONS,'Estudo — todas as questões')"><b>📚 ESTUDAR TODAS</b><small>Avance questão por questão e veja a resposta</small></button>
  <button class="mode" onclick="showThemes()"><b>📂 POR TEMA</b><small>Escolha um dos grupos do material</small></button>
  <button class="mode" onclick="startStudy(QUESTIONS.filter(q=>m.includes(q.idx)),'Revisão — questões erradas')"><b>🔥 QUESTÕES ERRADAS</b><small>${m.length} guardadas neste dispositivo</small></button>
 </div>
 <div class="card"><h3>Seu progresso neste dispositivo</h3><p class="muted">Questões marcadas como erradas: <b>${m.length}</b> de ${QUESTIONS.length}.</p><button class="danger" onclick="clearMistakes();renderHome()">Limpar questões erradas</button></div>
 <div class="card small muted">Nota: o app usa o gabarito que foi cruzado com o simulador Tijgadixa na etapa anterior. Esta versão não faz validação jurídica adicional.</div>`;
}
function showThemes(){
 app.innerHTML=`<div class="card"><h2>Escolha um grupo</h2><div class="grid">${groups().map(g=>`<button class="mode" onclick='startStudy(QUESTIONS.filter(q=>q.group===${JSON.stringify(g)}),${JSON.stringify(g)})'><b>${esc(g)}</b><small>${QUESTIONS.filter(q=>q.group===g).length} questões</small></button>`).join("")}</div></div><button class="secondary" onclick="renderHome()">← Voltar</button>`;
}
function startSim(){
  state.finished=false;
  state.mode="sim";
  state.list=shuffle(QUESTIONS).slice(0,SIM_COUNT);
  state.pos=0;
  state.answers=[];
  state.startedAt=Date.now();
  state.selected=null;
  state.checked=false;

  clearInterval(state.timer);

  state.timer=setInterval(()=>{
    const elapsed=Date.now()-state.startedAt;
    const remaining=Math.max(0,(TIME_LIMIT*1000)-elapsed);

    const el=document.getElementById("timer");

    if(el){
      const s=Math.ceil(remaining/1000);
      el.textContent=
        `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
    }

    if(remaining<=0){
      clearInterval(state.timer);
      finishSim();
    }
  },250);

  renderQuestion();
}
function startStudy(list,title){
 if(!list.length){app.innerHTML=`<div class="card center"><h2>Nenhuma questão disponível</h2><p class="muted">Ainda não há questões erradas guardadas.</p><button onclick="renderHome()">Voltar</button></div>`;return}
 state.mode="study";state.title=title;state.list=list;state.pos=0;state.answers=[];state.selected=null;state.checked=false;renderQuestion();
}
function renderQuestion(){
 const q=state.list[state.pos], total=state.list.length, selected=state.selected;
 const progress=((state.pos)/total)*100;
 app.innerHTML=`<div class="card">
 <div class="qmeta"><span>${esc(state.title||"Simulado")}</span><span>${state.pos+1} / ${total}${state.mode==="sim"?` • <b id="timer">60:00</b>`:""}</span></div>
 <div class="progress"><div style="width:${progress}%"></div></div>
 <div class="tag">${esc(q.group)}</div>
 <div class="question">Questão ${String(q.number).padStart(2,"0")}<br>${esc(q.question).replace(/\\n/g,"<br>")}</div>
 ${q.hasImageNotice?`<div class="image-note">[IMAGEM ORIGINAL NÃO DISPONÍVEL]</div>`:""}
 <div>${q.alternatives.map(a=>`<button class="option ${selected===a.letter?"selected":""}" onclick="choose('${a.letter}')"><b>${a.letter})</b> ${esc(a.text).replace(/\\n/g,"<br>")}</button>`).join("")}</div>
 <div class="nav">
   <button class="secondary" onclick="prevQ()" ${state.pos===0?"disabled":""}>← Anterior</button>
   ${state.mode==="study" ? `<button onclick="checkStudy()">${state.checked?"Continuar →":"Ver resposta"}</button>` :
     `<button onclick="nextSim()">${state.pos===total-1?"Finalizar":"Próxima →"}</button>`}
 </div>
 </div>
 <button class="secondary" onclick="confirmHome()">🏠 Menu principal</button>`;
}
function choose(letter){state.selected=letter; if(state.mode==="sim"){state.answers[state.pos]=letter} renderQuestion()}
function checkStudy(){
 const q=state.list[state.pos];
 if(!state.checked){
   if(state.selected && state.selected!==q.answer)saveMistake(q.idx);
   state.checked=true;renderQuestion();return;
 }
 state.pos++;state.selected=null;state.checked=false;
 if(state.pos>=state.list.length)renderHome();else renderQuestion();
}
function nextSim(){
 if(!state.selected){alert("Selecione uma alternativa antes de continuar.");return}
 if(state.pos===state.list.length-1){finishSim();return}
 state.pos++;state.selected=null;renderQuestion();
}
function prevQ(){if(state.pos>0){state.pos--;state.selected=state.answers[state.pos]||null;state.checked=false;renderQuestion()}}
function finishSim(){
 if(state.finished)return;
 state.finished=true;
 clearInterval(state.timer);
 let correct=0;
 state.list.forEach((q,i)=>{if(state.answers[i]===q.answer)correct++;else if(state.answers[i])saveMistake(q.idx)});
 const total=state.list.length, wrong=total-correct;
 app.innerHTML=`<div class="card result"><h2>Resultado</h2><div class="score ${correct>=PASS_SCORE?"pass":"fail"}">${correct}/${total}</div><h3>${correct>=PASS_SCORE?"APROVADO":"NÃO APROVADO"}</h3><p class="muted">${correct>=PASS_SCORE?`Você atingiu ${PASS_SCORE} respostas certas.`:`São necessárias ${PASS_SCORE} respostas certas para atingir o objetivo do simulador.`}</p><p><b>Acertos:</b> ${correct} &nbsp; <b>Erros:</b> ${wrong}</p><div class="nav"><button onclick="reviewLast(${JSON.stringify(state.list.map((q,i)=>state.answers[i]===q.answer?null:q.idx).filter(x=>x!==null))})">Revisar erros</button><button class="secondary" onclick="renderHome()">Menu principal</button></div></div>
 <div class="card"><h3>Resumo</h3><table><tr><th>Questão</th><th>Sua resposta</th><th>Gabarito</th></tr>${state.list.map((q,i)=>`<tr><td>${String(q.number).padStart(2,"0")}</td><td>${state.answers[i]||"—"}</td><td>${q.answer}</td></tr>`).join("")}</table></div>`;
}
function reviewLast(ids){startStudy(QUESTIONS.filter(q=>ids.includes(q.idx)),"Revisão — erros do último simulado")}
function confirmHome(){if(confirm("Sair e voltar ao menu? O progresso deste modo será perdido."))renderHome()}
renderHome();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error));
}
</script>
